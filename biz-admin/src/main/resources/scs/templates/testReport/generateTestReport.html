<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('文件上传')" />
    <th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>文件上传 & 任务列表</h5>
                </div>
                <div class="ibox-content">

                    <!-- 上传区域 + 下载模板按钮  -->
                    <div class="row">
                        <div class="col-sm-2">
                            <label class="font-noraml">报告模板上传</label>
                            <div class="file-loading">
                                <input id="singleFile" name="file" type="file">
                            </div>
                        </div>

                        <div class="col-sm-3" style="margin-top:28px;">
                            <button type="button" class="btn btn-primary" onclick="downloadTemplate()">
                                <i class="fa fa-download"></i> 下载报告模板
                            </button>
                        </div>
                    </div>
                    <hr/>

                    <!-- 表格区域 -->
                    <div class="row">
                        <div class="col-sm-12">
                            <table id="bootstrap-table" class="table table-striped"></table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: bootstrap-fileinput-js" />
<script th:inline="javascript">
    var prefix = ctx + "testReport/task";
    var datas = [[${@dict.getType('sys_job_status')}]];

    // 下载报告模板
    function downloadTemplate() {
        window.location.href = ctx + "testReport/template/download";
    }

    $(function() {
        var options = {
            url: prefix + "/list",
            columns: [
                {
                    field: 'projectName',
                    title: '项目名称'
                },
                {
                    field: 'status',
                    title: '状态',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                },
                {
                    field: 'errorMessage',
                    title: '错误信息'
                },
                {
                    field: 'createTime',
                    title: '创建时间'
                },
                {
                    title: '操作',
                    align: 'left',
                    formatter: function(value, row, index) {
                        const actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + true + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.deptId + '\')"><i class="fa fa-download"></i>下载</a> ');
                        return actions.join('');
                    }
                }
            ]
        }
        $.table.init(options);
    });

    $(document).ready(function () {
        // 单图上传
        $("#singleFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            var rsp = data.response;
            log.info("return url：" + rsp.url)
            log.info("reutrn fileName：" + rsp.fileName)
            log.info("reutrn newFileName：" + rsp.newFileName)
            log.info("return originalFilename：" + rsp.originalFilename)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })

        // 多图上传
        $("#multipleFile").fileinput({
            uploadUrl: ctx + 'common/uploads',
            uploadAsync: false
        }).on('filebatchuploadsuccess', function (event, data, previewId, index) {
            var rsp = data.response;
            log.info("return urls：" + rsp.urls)
            log.info("reutrn fileNames：" + rsp.fileNames)
            log.info("reutrn newFileNames：" + rsp.newFileNames)
            log.info("return originalFilenames：" + rsp.originalFilenames)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
    });
</script>
</body>
</html>
